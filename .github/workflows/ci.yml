name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  harness:
    name: Agent harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository harness
        run: make harness

  rust:
    name: Rust workspace (1.97.1)
    needs: harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
      - name: Select pinned Rust toolchain
        run: rustup default 1.97.1
      - name: Full validation gate
        run: make ci

  msrv:
    name: Rust MSRV (1.88.0)
    needs: harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install declared minimum Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Check declared MSRV
        run: cargo +1.88.0 check --workspace --all-targets
