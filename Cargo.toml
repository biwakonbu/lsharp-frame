[workspace]
resolver = "2"
members = [
    "crates/lsharp-frame-contract",
    "crates/lsharp-frame-spi",
    "crates/lsharp-frame-core",
    "crates/lsharp-frame-adapter-headless",
    "apps/lsharp-frame-headless",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.dev]
debug = 1

[profile.test]
debug = 1
